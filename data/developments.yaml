- id: benton-moratorium-restrained
  title: A judge paused Benton County's data-center ban
  kind: Litigation
  date: 2026-09-08
  date_note: Temporary restraining order granted; suit filed 24 August 2026
  summary: >
    Benton County banned new data centers on 10 August. Three days later a new company, NSI
    6, was formed. Eleven days after that it sued, and on 8 September a judge put the ban on
    hold while the case runs.
  detail:
    - >
      The county's rule covers anything 2,500 square feet or 250 kilowatts and up, and
      reaches substations, switchyards, battery storage and backup generators as well as the
      data center itself. It was meant to last six months.
    - >
      NSI 6 was formed on 13 August and sued on 24 August, naming the county and three
      commissioners — Steve Daleske, Scott Harms and Larry Berry — each in the job they
      hold rather than personally. All four were served on the afternoon of 27 August, and
      by 4:35 that afternoon a Springfield law firm had written to say it would act for
      them.
    - >
      Three judges have now touched the case in two weeks. The judge it was assigned to,
      Brandon Baker, stepped aside on 8 September because as the circuit's presiding judge
      he works with the commissioners on the court's own budget, and he appointed a retired
      judge, Jackie Cook, in his place. The order pausing the ban was signed the same day by
      a third, Senior Judge James K. Journey. It holds for fifteen days, on condition NSI 6
      put up a $10,000 bond — which it paid on 10 September — and all four defendants were
      ordered to court to say why the pause should not continue.
    - >
      On 15 September NSI 6 asked the court to keep cameras and microphones out of that
      hearing, on the ground that it would expose who its contractors, its investors and its
      possible tenants are. The court refused the next day. The hearing was set for
      21 September. Pausing the ban is not a decision about who is right, which has not been
      argued yet.
  entities: [case-nsi6-v-benton, nsi-6, benton-county-commission, site-benton,
             steve-daleske, scott-harms, larry-berry, judge-brandon-baker,
             judge-james-journey, judge-jacqueline-cook, travis-elliott,
             ellis-ellis-hammons-johnson]
  citations:
    - doc: evidence/04-litigation/26BE-CC00056_nsi-6-v-benton-county/2026-08-24_petition-for-declaratory-judgment-and-injunctive-relief.pdf
      label: Petition for declaratory judgment and injunctive relief
      date: 2026-08-24
      excerpt: >
        the contract purchaser by assignment … intends to construct and operate a
        data-center project
    - doc: evidence/04-litigation/26BE-CC00056_nsi-6-v-benton-county/2026-08-24_exhibit-1_benton-county-data-center-moratorium-order.pdf
      label: Exhibit 1 · Benton County moratorium order
      date: 2026-08-10

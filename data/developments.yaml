- id: benton-show-cause-hearing
  title: A judge extended the pause on Benton County's ban
  kind: Litigation
  date: 2026-09-21
  date_note: Show-cause hearing held; the restraining order extended
  summary: >
    The hearing on whether Benton County can enforce its data-center ban was held on
    21 September. The judge extended the restraining order already in force and urged
    caution about carrying on with construction until a final decision, for which no date
    has been set.
  detail:
    - >
      The order pausing the ban was written to last fifteen days from 8 September, so the
      hearing was about what should replace it. NSI 6 had asked for a preliminary injunction,
      an order holding the ban off the books for as long as the case takes. It did not get
      one, and it was not refused one either. The judge extended the restraining order
      already in force instead, urged caution about carrying on with construction, and left
      the decision for later without setting a date for it. How long the extension runs is
      not in the report. The ban stays unenforceable, and whether it is lawful is still
      unargued.
    - >
      Presiding Commissioner Steve Daleske testified that the commissioners met the
      developer, Trent Overhue, on 24 June, about a data center somewhere else, further
      north on Highway BB, and that nothing final was said about where one would go. He
      said they signed no non-disclosure agreement, were shown no paperwork that a purchase
      had closed or was being worked on, had no contact with Overhue after that meeting, and
      did not know where the project had landed before they signed the ban on 10 August. The
      ban, he said, was to buy the county time to gather information and answer questions
      about data centers.
    - >
      That account sits beside the commission's own minutes. Five days after the 24 June
      meeting, the minutes for 29 June record commissioners telling residents that no
      facility is located here, and the minutes for 13 July say it again. Daleske's evidence
      is that the June meeting was about a different site and settled nothing. Nothing in
      this file resolves the two against each other, and the minutes are a record of what was
      said in open session rather than of what the commissioners knew.
    - >
      The county also argued that the ban should stand because NSI 6 was not legally a
      company until 13 August, three days after the ban passed. The dates were already here:
      the articles of organization are dated 13 August, and both the petition and the
      restraining-order motion call NSI 6 "the contract purchaser by assignment" without
      naming who held the contract before it. What is new is that the county is making that
      gap an argument.
    - >
      Overhue testified that he chose Benton County on purpose, because it has no planning
      and zoning to stop him building a data center. It is the same reason he gave at the
      2 September hearing. He closed on the twelve acres on 9 September, has started
      clearing the land, and means to put up two buildings of about 20,000 square feet
      each. That is the first figure in this file for how big the buildings are meant to be,
      and either one on its own is eight times the floor area at which the county's ban
      would apply.
    - >
      George Hall, who attended the hearing opposed to the data center, answered that
      testimony. "Well, my main concern on this data center situation is the fact that the
      developer himself has stated that he particularly picks third-class counties, rural
      areas. That covers 90 counties in Missouri. When he does that, then he disenfranchises
      the property owners, the taxpayers, as well as the voters. Because he's saying, now you
      have no say, I'll do whatever I want. It don't work that way," Hall said.
    - >
      No docket entry for the hearing and no written order has reached this file, so the
      account above rests on a single news report, and "urging caution" are the reporter's
      words rather than an order's. That report writes the company's name two ways, NSIC6 LLC
      and NSI6 LLC; the articles of organization and the filings have it as NSI 6, LLC. The
      hearing was open to cameras: NSI 6 asked on 15 September that they be kept out, saying
      they would expose who its contractors, its investors and its possible tenants are, and
      the court refused the next day.
    - >
      Nothing has been decided on the merits. Keeping a rule on hold is not a ruling that the
      rule is unlawful, and neither side has argued that question yet. Springfield has refused
      to take in data-center paperwork since June under a freeze of its own, and on
      17 September the company behind the proposed Springfield site sued to have that rule
      struck down.
  entities: [case-nsi6-v-benton, nsi-6, benton-county-commission, site-benton,
             trenton-overhue, steve-daleske, scott-harms, larry-berry,
             judge-jacqueline-cook]
  citations:
    - doc: evidence/04-litigation/26BE-CC00056_nsi-6-v-benton-county/press/2026-09-21_ky3-com_judge-extends-restraining-order-benton-county-data-center-case.pdf

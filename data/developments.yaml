# Recent developments. Hand-curated.
#
# This list used to be computed: whatever the record happened to date inside the
# last thirty days, in date order. That answered "what was filed recently" and not
# "what happened recently". A notary and a law firm arrived at the top of it
# because a deed they had touched was recorded, and the reader was handed the
# parts of an event and left to assemble it.
#
# So it is written instead. An entry is an EVENT, not a document: "the Warsaw
# tract was sold by the Hilty trusts" rather than three trustee's warranty deeds
# listed one after another. The documents are still the point. Every entry cites
# them, and the build fails on an entry that cites nothing or cites a file that is
# not in this repository, exactly as it does for a node or an edge.
#
# WRITE IT FOR SOMEONE WHO IS NOT A LAWYER. The filings are full of terms of art
# and the excerpts quote them exactly, because an excerpt is evidence and has to
# be verbatim. The summary and the detail are ours, and they are where a reader
# who has never heard of a fixture filing finds out what one does. If a sentence
# cannot be read at ordinary speed by someone who does not work in this, it is not
# finished.
#
# Nothing here is drawn on the canvas. The halo, the NEW chip and the age rings
# are still measured from the dates in entities.yaml against the reader's own
# clock; this list is editorial.
#
# Fields
#   id          slug, unique. The dialog is addressed by it
#   title       the event, in the words a reader would use for it
#   kind        one short chip: Litigation, Land, Finance, Regulatory
#   live        true while the thing the entry describes is still going on — a
#               hearing in session. It puts a Live badge on the entry, and it is a
#               promise to come back: take it off the entry when the day is over
#               and the entry says what happened
#   date        YYYY, YYYY-MM or YYYY-MM-DD. What the entry is dated to
#   date_note   what that date is the date OF
#   summary     one or two sentences. This is the list; make it carry the event
#   detail      paragraphs for the dialog
#   entities    optional. Ids from entities.yaml, drawn as links into the map
#   citations   required, >= 1. Same contract as a node or an edge

- id: brown-defamation-suit
  title: Candidate for county office is the second critic sued for defamation
  kind: Litigation
  date: 2026-10-05
  date_note: Filed in Webster County; Overhue swore to it on 2 October
  summary: >
    Trenton Overhue and NSI, A.1 are suing Gail Peak Brown, who is running for Webster
    County Presiding Commissioner, over two July videos of generator noise at the Marshfield
    site. The suit does not say the noise was made up. It says the generator was being
    tested, and that her posts made a test look like the way the site always runs.
  detail:
    - >
      On 23 July Brown posted two videos of the site on Facebook. The first, at 5:50 p.m.,
      asked people to be at city hall that night: "Were these emissions anticipated this
      close to our city pool? This much noise and it appears only one generator is fired
      up." The second went up at 10:08 p.m.: "Would ANYONE like to purchase my property on
      Rifle Range??? This is NOT OK!!! I just took this video tonight." In a comment under
      it she said she had asked the council about soil samples, emissions and the water in
      the city pool. The meeting was the Board of Aldermen's hearing on a temporary halt to
      approvals for data centers, battery storage, solar and wind projects inside the city.
      The Rifle Range Road site is outside the city limits, as she noted herself: "this
      sits right on the outskirts."
    - >
      The suit is sworn by Overhue, and it accepts that the noise and exhaust were real while
      the generator ran. What it calls false is the impression the posts left, that the
      site runs like this all the time. By the petition's account the site ordinarily runs
      entirely on electricity from the utility. Its generators run for testing and to keep
      it going during the utility's yearly maintenance on the grid, and they are expected to
      run "a modest number of hours" a year. It cools with fluid in a closed loop, and does
      not drain water onto the ground or into the pool. All of that is Overhue's sworn
      account, not a record from the site. It agrees with what he told a business panel in
      June. The petition does not name the utility, and no power agreement with any utility
      is in this file.
    - >
      Nothing here shows whether the generator Brown filmed was being tested. On 18 July,
      five days earlier, firefighters shut down Generator #3 because of the smoke coming off
      it, and the fire district's report says that cut power to one of the server rooms. So
      that night at least one server room was running on a generator. The same report calls
      the site "under construction at this time." The petition does not say when the testing
      began or ended.
    - >
      None of Brown's posts attached to the suit names Overhue or NSI, A.1. In the thread as
      attached, Overhue's name appears only in a reply from Katherine Wiltse, the defendant
      in the first defamation suit: "Trent Overhue said it would sound just like a commercial
      AC unit- not even close." The petition relies on that reply to show readers would
      connect the posts to him. NSI, A.1's own project is in Springfield, and the petition
      itself calls it separate from the Marshfield site. The company says people weighing
      deals with it knew of its tie to Overhue and lost confidence in it. It names no
      amount, and says any award should be limited "to avoid duplicate compensation for the
      same injury" it claims against Wiltse, where it put its losses at more than
      $1,000,000.
    - >
      The petition also attaches a video Brown posted on 24 September from a page called
      "Gail Peak-Brown for Webster County Presiding Commissioner," in which she says "the
      flock cameras" are "right above the cyber truck there." The petition offers it as
      context for the July posts. Overhue answered under the video that the objects are
      "jobsite lights," and wrote: "I think everyone is growing tired of you running your
      campaign on misinformation and deception to create fear within the community and gain
      votes." In the same comment he wrote of installing cameras "on my property." The owner
      on the deeds is Lumon Solutions Marshfield, LLC.
    - >
      The suit against Wiltse was filed the day before a new Missouri law took effect that
      makes suits like these easier to have thrown out early. This one was filed after it.
      Whether the law applies here is for the court. No summons, and no response from Brown,
      is in this file yet.
  entities: [case-overhue-v-brown, gail-peak-brown, trenton-overhue, nsi-a1,
             katherine-wiltse, case-overhue-v-wiltse, site-marshfield, city-of-marshfield,
             marshfield-fire-district, lumon-solutions-marshfield]
  citations:
    - doc: evidence/04-litigation/26WE-CC00131_overhue-and-nsi-a1-v-brown/2026-10-05_verified-petition.pdf
      label: Verified petition ¶¶1, 13, 17, 61, 63-64, 66, 71, 84, 104 and Overhue's sworn verification
      date: 2026-10-05
      excerpt: >
        publishing false factual implications that temporary generator testing at the
        digital-infrastructure facility on Rifle Range Road in Webster County, Missouri,
        represented the Facility's ordinary, continuing method of operation … which is a
        separate project from the operating Facility discussed in Brown's July 23 posts …
        understood Brown's publications to concern NSI A1's competence and responsibility as
        a developer because they knew of its connection to Overhue … The Facility ordinarily
        operates entirely on electricity supplied by the utility provider. … The on-site
        generators allow the Facility to continue operating while the utility provider

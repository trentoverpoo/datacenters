- id: springfield-moratorium-suit
  title: Springfield sued over its data-center freeze
  kind: Litigation
  date: 2026-09-17
  date_note: Petition filed in Greene County
  summary: >
    Springfield has refused to take in any data-center paperwork since June, under a rule
    that runs until 17 November. The company behind the proposed Springfield site is suing
    to have that rule struck down, and is asking the court only to make the city accept and
    consider its application, not to approve the project.
  detail:
    - >
      Ordinance 28306 passed on 29 June 2026. While it stands, neither the city nor City
      Utilities will accept or process anything to do with a data center: building permits,
      site-plan review, stormwater, occupancy, utilities or a large electric hookup. It
      expires on 17 November, and the council can lift it for a single application if it
      votes to.
    - >
      NSI, A.1 sued on 17 September, eleven weeks after the rule passed and nine days after
      the Benton County case won its pause. Two of its six arguments are about how the rule
      was made. The first is that it is a zoning rule in everything but name, so the city
      owed the public the notice and the hearing that zoning requires and never gave either.
      The second is that it was written and filed as a "resolution" when the city's own
      charter says a measure like this has to be passed as an "ordinance". A third argument
      is a public-records complaint. The rest ask the court to narrow the rule if it will not
      strike it down.
    - >
      Per KY3, the company's answer on the zoning point is that the property at
      2900 S. National is already identified as administrative and professional offices and
      that the zoning there permits data processing services, so the moratorium does not
      reach it — and that city planners had approved the project before the moratorium
      passed. The city's own pre-development file runs the other way: on 3 August its
      planning reviewer wrote that the proposed use does not align with the permitted uses
      of Planned Development 251. KY3 also describes the company as asking the court to lift
      the moratorium, which is broader than what it actually asked for; the petition prays
      only that the city accept and process what is filed.
    - >
      The next morning the company asked for an emergency hearing and offered $1 as
      security. The city was served the same day. No court has ruled on any of it yet.
  entities: [case-nsi-a1-v-springfield, springfield-ordinance-28306, nsi-a1, city-of-springfield]
  citations:
    - doc: evidence/04-litigation/2631-CC01131_nsi-a1-v-city-of-springfield/2026-09-17_verified-petition-for-declaratory-and-injunctive-relief.pdf
      label: Verified petition for declaratory and injunctive relief
      date: 2026-09-17
      excerpt: >
        Plaintiff asks only that the City not enforce a void zoning moratorium to refuse
        acceptance and ordinary processing of complete submissions under the law otherwise

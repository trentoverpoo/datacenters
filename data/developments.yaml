- id: marshfield-september-financing
  title: More borrowing against the Marshfield site
  kind: Finance
  date: 2026-09-04
  date_note: Second deed of trust and assignment of rents recorded
  summary: >
    OakStar Bank took a second mortgage on 259 Rifle Range Road for up to $1,500,000, plus a
    claim on any rent the property earns. Together with July's mortgage, the bank can now
    lend up to $5,575,000 against the site.
  detail:
    - >
      OakStar's first mortgage, for up to $4,075,000, was filed on 13 July, along with a
      claim over everything the company owns and a separate claim on four Cummins
      generators. The September filings, both recorded as deeds of trust, add the second
      mortgage and the claim on rent. Those figures are ceilings on what the bank may lend
      against the property, not a record of what has been borrowed.
    - >
      The day before, Northstar Enterprise & Defense put its own claim on record over the
      nine Synapse computing units standing on the site. Equipment fixed to land can
      otherwise count as part of the land and pass to whoever holds the mortgage on it, so
      filing this way keeps Northstar ahead of the bank in the queue for those units.
      Recording it the day before the bank's own filing is ordinary practice.
  entities: [oakstar-bank, lumon-solutions-marshfield, site-marshfield,
             northstar-enterprise-defense, stn-incorporated]
  citations:
    - doc: evidence/01-marshfield-site/recorded-instruments/2026-09-03_inst-2026004939_ucc1-fixture-filing_northstar-vs-stn.pdf
      label: UCC-1 fixture filing, Inst. 2026004939 · what it covers

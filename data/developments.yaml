- id: warsaw-tract-sold-by-hilty-trusts
  title: Warsaw tract sold by the Hilty trusts
  kind: Land
  date: 2026-09-09
  date_note: Three deeds recorded together at 1:32 PM
  summary: >
    Three Hilty family trusts each sold a one-third share of the twelve acres at 29101 Old
    Hwy 65 to NSI 6. The deeds were recorded within three seconds of one another, and the
    state permit to start disturbing the ground took effect the same day.
  detail:
    - >
      The land moved twice in two months. On 9 July 2026 the Stanfred L. Hilty Residuary
      Trust passed the whole tract to trusts belonging to three Hilty sons. On 9 September
      each of those three signed its share over to NSI 6, which left NSI 6 owning all of it.
      Hogan Land Title filed all three deeds.
    - >
      Two of them were signed that day in front of a notary in Springfield. The third had
      been signed a week earlier, on 2 September, in front of a notary in Big Sandy,
      Montana. Each deed records the price as one dollar and other consideration, a standard
      form of words that keeps the real figure off the public record.
    - >
      On the same day the deeds were filed, the Missouri Department of Natural Resources
      permit to disturb the ground at the site took effect. The facility is named on it as
      "COLD STORAGE".

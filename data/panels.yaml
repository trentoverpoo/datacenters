# The prose that reaches the interface as a dialog.
#
# Every dialog on this site used to carry its own copy of the same two hundred
# lines: a template literal of HTML inside ui.js, and beside it a hand-rolled
# open/close/focus/Escape/backdrop routine, written out once per dialog. Editing
# a sentence meant editing JavaScript, and the four routines had already drifted
# apart from each other.
#
# So the mechanics live in js/dialog.js, once, and the words live here. A panel
# is rendered by MAP.renderPanel: a title, a lede, a run of sections, and a foot.
#
# Blocks a section may carry, in the order they render:
#   heading   an h3 above the section
#   cards     a list of { title, body } — the bordered rows the panels are built from
#   from      a list in data/non-claims.yaml to draw the cards from instead
#   rows      a list of { keys, desc } — the keyboard table
#   note      a small muted paragraph
#
# TEXT IS NOT HTML. Everything is escaped, and exactly three pieces of inline
# markup survive: [text](href) is a link, `code` is code, and **bold** is bold.
# A link may only be http, https, mailto or a path inside this site. That is the
# whole vocabulary, and it is deliberately the whole vocabulary: the words on
# this page should not be able to reach into the page they are on.
#
# {nodeCount}, {edgeCount}, {documentCount} and {recentPhrase} are substituted
# from the compiled graph, so no panel states a number the build could disagree
# with.

notClaimed:
  label: What this map claims, and what it does not
  title: What this map claims, and what it does not
  lede: >
    This project maps who owns what, who is connected to whom, and where the money behind
    the southwest Missouri data-center build-out comes from. It is assembled from
    {documentCount} documents: deeds, UCC filings, corporate registrations, SEC filings,
    permits, court records and captured public pages. This project claims nothing beyond
    what is stated in public record.
  sections:
    - heading: What is claimed, and stood behind
      cards:
        - title: The entities, the people, the land and the lines between them
          body: >
            Each of the {nodeCount} entities and {edgeCount} connections drawn here cites at
            least one document. The map is built on page-load, and the build fails if a
            relationship between entities is not backed up by an active source. A solid line
            rests on a primary record in `evidence/`.
        - title: >
            That out-of-state capital and out-of-state operators are working through locally
            registered entities
          body: >
            This is the shape of the record, and it is asserted plainly: formation documents
            filed in other states, officers and agents signing from other states, lenders'
            instruments recorded against Missouri parcels, and single-purpose entities
            holding land they bought from local owners. Every step of that is on the map with
            the filing that establishes it. Read the documents rather than take our word for
            it. That is what they are here for.
        - title: The dates, and the order things happened in
          body: >
            Formation, purchase, recording, permitting and filing dates are as the records
            state them. Where a record gives only a month or only a year, the map shows only
            that much, and the time scrubber moves on those dates alone.

    - heading: What is not claimed
      cards:
        - title: No crime, no fraud, no wrongdoing by anyone
          body: >
            Nothing on this map alleges that any person or company has broken a law, breached
            a duty or acted improperly. Forming an entity in another state, assembling land
            through a single-purpose LLC, borrowing against it, using a registered-agent
            address and declining to name a prospective tenant are all ordinary and lawful
            ways to do business. If a line here reads as an accusation, that reading is the
            reader's and not the record's.
        - title: Connection is not coordination
          body: >
            An edge means two parties appear together in a document or a transaction. It does
            not claim they act in concert, share a plan or purpose, or know what the other is
            doing.
        - title: No motive, no intent, no forecast
          body: >
            The record shows what was done and when. It does not establish why, what anyone
            meant by it, or what anyone will do next, and this map does not guess at any of
            the three.
        - title: Nothing about consequences
          body: >
            No claim is made here about water, electricity, rates, emissions, tax abatements,
            jobs, property values, or whether any of this is good or bad for the people who
            live nearby. Those are arguments worth having somewhere else. This is a file, not
            a brief.
        - title: A dashed line is a question, not a finding
          body: >
            Tier-3 connections are threads the file tracks and does not treat as settled.
            Each one has to say what evidence would resolve it, or the build rejects it.
        - title: An absent line means an absent document
          body: >
            Where no connection is drawn, nothing has been found. It is not proof that no
            relationship exists. This map is the portion of the picture that documents
            currently support.
        - title: Appearing here is not an accusation
          body: >
            Many entities and people are on this map because they sold land, lent money,
            notarized an instrument, issued a permit or filed a routine report. Presence on
            the map carries no implication about anyone, and the categories and colors mark
            what a party is, never how it should be judged.
        - title: A recent development is an editorial summary
          body: >
            The Recent developments list is written by hand, not computed from the file. It
            says what a group of documents amounts to, which is a reading. The documents it
            cites are the record, and each entry links to every one of them.

    - heading: Expressly not claimed
      from: notClaimed
    - heading: "Open questions: why some expected lines are absent"
      from: openQuestions
    - heading: Threads closed by review
      from: closedThreads

    - heading: If something here is wrong
      note: >
        A name, a date, a relationship read the wrong way out of a filing. Corrections are
        wanted, and they are made against the document. Use the tipline, or write to
        [trentoverpoo@proton.me](mailto:trentoverpoo@proton.me).

tipline:
  label: Send a tip
  title: Send a tip
  lede: >
    This project is entirely sourced from public documents and information. If you have
    something that we haven't found yet, we'd love to hear about it.
  sections:
    - heading: What's valuable
      cards:
        - title: Documents
          body: >
            Filings, contracts, permits, correspondence, minutes, financial records: anything
            with a date and a source, even a partial one.
        - title: Corrections
          body: >
            A name, date, or relationship on this map that's wrong, outdated, or missing
            context.
        - title: Leads
          body: >
            A person, entity, or public record worth looking into, even without documents in
            hand yet.
    - heading: Anonymity
      cards:
        - title: Your identity stays out of it
          body: >
            Tips are handled anonymously. Nothing you send is published or attributed without
            your explicit permission. Using an email service like
            [Proton](https://account.proton.me/signup) adds an extra layer of protection to
            your identity.
    - heading: Request opt-out
      cards:
        - title: Your California privacy rights
          body: >
            This project does not sell or share personal information, and a tip is only ever
            used to check and, where it holds up, correct the map. If you are a California
            resident and want to formally request that any personal information not be sold, shared, or retained, write to
            [trentoverpoo@proton.me](mailto:trentoverpoo@proton.me) with "California opt-out"
            in the subject line, and it will be honored.
  foot: "[trentoverpoo@proton.me](mailto:trentoverpoo@proton.me)"

terms:
  label: Terms of use
  title: Terms of use
  lede: >
    This site is a public, non-commercial research file about land, entities and
    financing behind the southwest Missouri data-center build-out. It is free to read and
    free to check. Use it, quote it, and follow the citations back to the documents. That
    is what it is for.
  sections:
    - note: Last updated 20 September 2026.
    - heading: No allegation of wrongdoing
      note: >
        Nothing on this site alleges that any person or company has broken a law, breached
        a duty or acted improperly. The map records what documents state and who appears in
        them. It does not claim motive, intent, coordination or misconduct, and appearing on
        the map carries no implication about anyone. The full statement of what is and is not
        claimed is in the **Not claimed** panel on the map.
    - heading: Accuracy, and the limits of it
      note: >
        Every entity and connection cites a document, and the build fails rather than warns
        if a citation points at a file that is not in this repository. That check guarantees
        the citation, not the underlying record: public filings contain errors, records go
        stale, and a reading of a document can be wrong. The site is provided as is, without
        warranty of any kind, and nothing here is legal, financial, investment or professional
        advice. Verify anything you intend to rely on against the primary record.
    - heading: Corrections
      note: >
        Corrections are wanted and are made against the document. Write to
        [trentoverpoo@proton.me](mailto:trentoverpoo@proton.me) with what is wrong.
    - heading: Reuse
      note: >
        The site's code is published under the GNU General Public License v3, in the
        project's repository. The documents in `evidence/` are public records and
        third-party materials gathered from public sources; they carry whatever rights their
        own authors and issuers hold, and this project claims none over them. If you reuse
        the research, cite it and keep the citations attached: a claim separated from its
        document is exactly what this file exists to avoid.
    - heading: Acceptable use
      note: >
        Do not use this site or the material in it to harass, threaten, intimidate or
        endanger anyone, and do not use it to construct accusations the record does not
        support. People named here include sellers, lenders, notaries, officials and others
        who appear only in the ordinary course of business.
    - heading: Not a consumer report
      note: >
        This site is not a consumer reporting agency, and nothing on it is a "consumer
        report" as the Fair Credit Reporting Act (FCRA), 15 U.S.C. § 1681 et seq., defines
        that term. The material here is not compiled, maintained or offered for the purpose
        of establishing a person's eligibility for credit, insurance, employment, housing,
        tenant screening or any other purpose the FCRA covers, and it has not been vetted
        for accuracy, completeness or currency to that standard. Do not use this site, or
        anything in it, to make a decision about a person's eligibility for any
        FCRA-covered purpose.
    - heading: Geographic scope and foreign privacy laws
      note: >
        This site is geo-blocked to the United States at the domain level and is not
        directed at, marketed to, or offered to residents of any other country. Reaching it
        from outside the United States requires defeating that block, such as by using a
        VPN or proxy to make the site appear to be accessed from the United States. Doing so
        is against this project's intent and outside its control. Accordingly, this project
        does not undertake to comply with, and disclaims all liability under, the privacy or
        data-protection laws of any jurisdiction other than the United States — including,
        without limitation, the EU/UK General Data Protection Regulation (GDPR) or any other
        country's privacy law — as applied to a visitor who reaches the site by defeating the
        geo-block.
    - heading: Outside links
      note: >
        Links marked **Live** point to pages this project does not control. They are
        offered so you can check a captured source against the public one; their content,
        availability and terms are their owners' own.
    - heading: Availability
      note: >
        This is a static page served from a third-party host. It may change, move or be
        unavailable at any time, and no uptime or continuity is promised.
    - heading: Changes
      note: >
        If these terms change, the revised version replaces this text and the date above
        changes with it. The change history is public in the project's repository.

privacy:
  label: Privacy
  title: Privacy
  lede: >
    The short version: this site collects nothing about you. It is a static page: HTML,
    CSS and JavaScript files and a data file, served as they are. There is no account, no
    login, no form, no server of ours to send anything to.
  sections:
    - note: Last updated 18 September 2026.
    - heading: What is not collected
      cards:
        - title: Analytics and tracking
          body: No analytics, no tracking pixels, no fingerprinting.
        - title: Cookies
          body: No cookies.
        - title: Advertising
          body: No advertising, and no third-party advertising or data-broker services.
        - title: Accounts and forms
          body: No account, sign-up, contact form or newsletter.
        - title: Search and filters
          body: >
            Nothing you type into the search or filter boxes leaves your browser. The map
            data is loaded with the page and searched locally on your own device.
    - heading: What stays on your device
      note: >
        The site remembers one thing, and it stays in your own browser's local storage:
        whether you chose the light or dark theme. It is never sent anywhere. Clearing your
        browser's site data removes it.
    - heading: Hosting
      note: >
        The site is published as static files through GitHub Pages. Like any web host,
        GitHub's servers process the ordinary request information needed to deliver a page,
        such as your IP address and browser user agent, under its own policies, which are
        outside this project's control. This project does not receive, request or keep
        those logs.
    - heading: Links off this site
      note: >
        Source citations may link to outside pages: a filing index, an agency record, a
        published article. Once you follow such a link you are on someone else's site,
        under their privacy practices, not this one's.
    - heading: If you send a tip
      note: >
        Nothing on this site sends a tip for you. The tipline is an ordinary email address.
        If you choose to write, you are sending an email, and it carries whatever your own
        mail provider attaches to it, your address included. Tips are handled in
        confidence, and nothing you send is published or attributed to you without your
        explicit permission. Use an anonymous mailbox if that matters to you.
    - heading: Your California privacy rights
      note: >
        This site does not sell or share personal information, so there is nothing to opt
        out of in the ordinary sense. If you are a California resident and want to formally
        request that any personal information not be sold, shared, or retained, write to
        [trentoverpoo@proton.me](mailto:trentoverpoo@proton.me) with "California opt-out"
        in the subject line, and it will be honored.
    - heading: People named on the map
      note: >
        Entities and people appear on this map on the strength of public records: filings,
        deeds, permits, court documents and published pages. If a record about you here is
        wrong, out of date or missing context, write to
        [trentoverpoo@proton.me](mailto:trentoverpoo@proton.me) and it will be checked
        against the document and corrected if it is wrong.
    - heading: Changes
      note: >
        If this policy changes, the revised version replaces this text and the date above
        changes with it. The change history is public in the project's repository.

shortcuts:
  label: Keyboard shortcuts
  title: Keyboard shortcuts
  lede: These work once the map has keyboard focus. Click it, or tab to it.
  sections:
    - rows:
        - keys: ["←", "→"]
          desc: Step through entities
        - keys: ["↑", "↓"]
          desc: Follow a connection
        - keys: [Enter]
          desc: Open details
        - keys: ["+", "−", "0"]
          desc: Zoom
        - keys: ["/"]
          desc: Search
        - keys: [Esc]
          desc: Clear

# The one-time consent note, shown before the small-screen note and to every
# visitor once. Not a panel, for the same reason mobileNote is not one: no
# close button in the corner, one button at the foot, and it remembers that
# it has been read. The acceptable-use paragraph is quoted from the terms
# panel above verbatim; if that section changes, this one should change with it.
consent:
  label: Terms of use and acceptable use
  title: Before you use this map
  paragraphs:
    - >
      By continuing past this notice, you agree that you have read and consent to this
      project's Terms of use — reachable any time from **Privacy · Terms of use** in the
      sidebar footer — and you promise to abide by the **Acceptable use** section of it,
      quoted here in full:
    - >
      "Do not use this site or the material in it to harass, threaten, intimidate or
      endanger anyone, and do not use it to construct accusations the record does not
      support. People named here include sellers, lenders, notaries, officials and others
      who appear only in the ordinary course of business."
  button: I have read this and agree

# The small-screen note. Not a panel: no close button in the corner, one button
# at the foot, and it remembers that it has been read.
mobileNote:
  label: A note about small screens
  title: Better on a bigger screen
  paragraphs:
    - >
      Everything works here: pan, pinch to zoom, search, the filters, and the sources behind
      every entity and every line. Small screens were supported so the map is reachable from
      anywhere.
    - >
      But this is {nodeCount} entities and {edgeCount} connections meant to be read as one
      picture, and a phone can only show you part of it at a time. Where you can, open this
      page in a desktop browser.
  button: Continue on this device

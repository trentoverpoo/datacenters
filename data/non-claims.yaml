# Tier 4. Things the record expressly declines to claim, plus the threads the
# September 2026 review closed. None of these is drawn as a node or an edge — they
# reach the interface as text, in the "What this map does not claim" panel.

notClaimed:
  - title: No Sho-Me agreement
    body: >
      No Sho-Me entity is claimed to have contracted with Lumon, NSI or STN. Adjacency and
      an easement are documented; a transaction is not.
  - title: No Benton County power agreement
    body: >
      Aquila/Evergy and Central Electric Power Cooperative own the two tracts across the
      road from the Warsaw parcel. Nothing shows either has an agreement with NSI 6.
  - title: No price for the Warsaw parcel
    body: >
      The deeds state no price and no lender instrument has been located. Nothing here
      claims NSI 6 paid any particular amount, or that the purchase was or was not financed.
  - title: "\"Cold Storage\" is not interpreted"
    body: >
      The facility name on DNR permit MORA30685 is on the permit. What it refers to is not
      established.
  - title: The Marshfield tenant is not identified
    body: >
      STN owns the equipment. No lease is in the record, and NSI 6 is on record resisting
      disclosure of prospective lessees. The map shows equipment ownership, not tenancy.
  - title: Shared professional addresses are not common control
    body: >
      A law firm, a registered-agent suite and a Kansas resident-agent office are drawn as
      locations, never as control. Co-location is not connection.
  - title: The Owens Corning investment is not asserted
    body: >
      Northstar's own timeline claims an Owens Corning $5M Series A. A materials
      collaboration is externally confirmed; the investment attribution is not, and is not
      drawn.

# Why an expected line is absent: a question the record leaves standing, as opposed to a
# reading it declines to make. Declared here even while empty, because panels.yaml asks
# for this list by name and the build fails on a section that points at nothing.
openQuestions:
  - title: Who drafted the Benton County moratorium is not named
    body: >
      The commission's own minutes for 10 August 2026 say the Presiding Commissioner
      presented a moratorium "he has received from legal counsel, as requested by
      Commissioners." The order itself names no drafter — only the three commissioners who
      signed it and the County Clerk who attested it. The minutes of 8 September describe
      Travis A. Elliott as the county's legal representative, and he and Paige J. Parrack
      appear for all four defendants. No document in this file connects either statement to
      the other, so no line is drawn from counsel to the ordinance.
  - title: Who assigned the purchase contract to NSI 6 is not named
    body: >
      Both the petition and the motion for a temporary restraining order call NSI 6 "the
      contract purchaser by assignment." Nothing in this file names the party that held the
      contract first, or dates the assignment. NSI 6 was organised on 13 August 2026, three
      weeks after the developer testified he committed to the purchase on 23 July, so the
      contract cannot have run to NSI 6 at the start.

# Threads a review opened and then closed — something the file once tracked and no longer
# does, kept so the closing is on the record rather than silent.
closedThreads: []

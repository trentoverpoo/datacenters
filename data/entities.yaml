- id: benton-county-commission
  name: Benton County Commission
  category: government
  tier: 1
  date: 2026-08-10
  date_note: Adopted the data-center moratorium
  summary: >
    Adopted a six-month moratorium on data centers in unincorporated Benton County on
    10 August 2026, defining a data center at 2,500 sq ft or 250 kW and sweeping in
    substations, switchyards, BESS and backup generation. Defendant in 26BE-CC00056. Its
    own minutes record the moratorium arriving from legal counsel the record does not name,
    at the commissioners' request. The ban has been restrained since 8 September, and the
    restraint was extended on 21 September.
  caveat: >
    Through June and July the commission answered residents asking about data centers by
    saying it had no knowledge of one being located in the county. On 21 September the
    Presiding Commissioner testified that the commissioners had met the developer on
    24 June about a data center at a different location in the county, were shown no
    paperwork, and heard nothing further before they signed the ban on 10 August. The
    minutes are the record of what was said in open session; they are not evidence of what
    the commissioners knew, and nothing in this file settles how much that June meeting
    told them.
  citations:
    - doc: evidence/04-litigation/26BE-CC00056_nsi-6-v-benton-county/press/2026-09-21_ky3-com_judge-extends-restraining-order-benton-county-data-center-case.pdf
      url: https://www.ky3.com/2026/09/21/judge-extends-restraining-order-benton-county-mo-data-center-case/
      url_label: KY3 · the report as published
      label: KY3 · the Presiding Commissioner's account of the June meeting
      date: 2026-09-21
      excerpt: >
        Presiding Commissioner Steve Daleske testified that commissioners met with Overhue
        on June 24 about the possibility of a data center at a different location, further
        north on Highway BB. … Daleske said commissioners had no contact with Overhue after
        the June 24 meeting and did not know about the project's current location before
        they signed the moratorium on Aug. 10.
    - doc: evidence/04-litigation/26BE-CC00056_nsi-6-v-benton-county/2026-08-24_exhibit-1_benton-county-data-center-moratorium-order.pdf
      label: Exhibit 1 · Benton County moratorium order
      date: 2026-08-10
      excerpt: >
        2,500 sq ft or more, or has aggregate IT power capacity of 250 kW or more
    - doc: evidence/06-benton-county-site/commission-minutes/2026-08-10_benton-county-commission_minutes-moratorium-adopted.pdf
      label: Commission minutes, 10 August 2026 · adoption, and where the text came from

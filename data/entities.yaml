    official capacities. A temporary restraining order was granted on 8 September 2026 with
    a $10,000 bond, signed by Senior Judge James K. Journey on the same day the assigned
    judge recused and appointed a retired judge to the case. At the hearing on 21 September
    2026, which Case.net listed as a show-cause hearing and the court took up as the
